apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastapi-ml-canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "50"
spec:
  rules:
    - host: fastapi-ml.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fastapi-ml-canary
                port:
                  number: 8000