name: Docker Image

on:
  push:
    branches:
      - main
      - "week*"
      - "feature/*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      
    
    env:
      IMAGE_NAME: ghcr.io/wilbur-dev/fastapi-ml-example

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
        
        
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run training pipeline
        run: |
          python -m training.training \
            --config training/config.yaml \
            --register-model false \
            --random-state 123

      - name: Promote model into deployment artifact
        run: |
          python scripts/promote_model.py --model-stage production

      - name: Check deployment artifact exists
        run: |
          test -d deployment_mlruns/served_model
          test -f deployment_mlruns/promotion_metadata.json




      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/Wilbur-dev/fastapi-ml-example
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Show pushed image tags
        run: |
          echo "Pushed image tags:"
          echo "${{ steps.meta.outputs.tags }}"