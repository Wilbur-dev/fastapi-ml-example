name: CI

on:
  push:
    branches:
      - main
      - dev_init
      - "week*"
      - "feature/*"
  pull_request:

jobs:
  lint-test-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ruff
        run: ruff check .

      - name: Run pytest
        run: pytest -q

      - name: Import smoke test
        run: |
          python - <<'PY'
          import importlib

          module = importlib.import_module("app.main")
          assert hasattr(module, "app")
          print("Import smoke test passed: app.main.app exists")
          PY

      - name: Startup smoke test
        run: |
          python - <<'PY'
          from unittest.mock import patch
          import numpy as np
          from fastapi.testclient import TestClient

          class DummyModel:
              def predict(self, X):
                  return np.array([1])

              def predict_proba(self, X):
                  return np.array([[0.2, 0.8]])

          with patch("app.core.lifecycle.load_model") as mock_load_model:
              mock_load_model.return_value = (DummyModel(), "models:/demo/1")

              from app.main import app

              with TestClient(app) as client:
                  health_resp = client.get("/health")
                  assert health_resp.status_code == 200

                  version_resp = client.get("/version")
                  assert version_resp.status_code == 200

                  metrics_resp = client.get("/metrics")
                  assert metrics_resp.status_code == 200

              print("Startup smoke test passed")
          PY