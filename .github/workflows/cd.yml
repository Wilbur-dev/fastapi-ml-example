name: CD

on:
  workflow_dispatch:

jobs:
  deploy-to-k8s:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    env:
      IMAGE_NAME: ghcr.io/wilbur-dev/fastapi-ml-example

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster
        run: |
          kubectl get nodes

      - name: Deploy new image
        run: |
          kubectl set image deployment/fastapi-ml \
            fastapi-ml=${IMAGE_NAME}:${GITHUB_SHA}
            
            
      - name: Rollout status with auto rollback
        run: |
          set -e
          START=$(date +%s)

          if kubectl rollout status deployment/fastapi-ml --timeout=180s; then
            END=$(date +%s)
            echo "Rollout succeeded in $((END-START)) seconds"
          else
            END=$(date +%s)
            echo "Rollout failed after $((END-START)) seconds"
            echo "Rolling back to previous revision..."
            kubectl rollout undo deployment/fastapi-ml
            kubectl rollout status deployment/fastapi-ml --timeout=180s
            exit 1
          fi


      - name: Verify deployed image
        run: |
          kubectl get deployment fastapi-ml -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo
          
    
      
      - name: Show rollout history
        if: always()
        run: kubectl rollout history deployment/fastapi-ml

      - name: Show pods
        if: always()
        run: kubectl get pods -o wide

      - name: Describe deployment
        if: always()
        run: kubectl describe deployment fastapi-ml