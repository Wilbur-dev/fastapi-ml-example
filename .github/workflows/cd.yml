name: CD

on:
  workflow_dispatch:

jobs:
  deploy-to-k8s:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    env:
      IMAGE_NAME: ghcr.io/wilbur-dev/fastapi-ml-example

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster
        run: |
          kubectl get nodes

      - name: Deploy new image
        run: |
          kubectl set image deployment/fastapi-ml \
            fastapi-ml=${IMAGE_NAME}:${GITHUB_SHA}

      - name: Rollout status and measure duration
        run: |
          START=$(date +%s)
          kubectl rollout status deployment/fastapi-ml --timeout=180s
          END=$(date +%s)
          echo "Rollout duration: $((END-START)) seconds"

      - name: Verify deployed image
        run: |
          kubectl get deployment fastapi-ml -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo